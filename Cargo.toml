[package]
name = "rust-s3-server"
version = "0.9.0"
edition = "2021"

[dependencies]
# Async runtime
tokio       = { version = "1",    features = ["full"] }
tokio-util  = { version = "0.7", features = ["io", "rt"] }
futures     = "0.3"
bytes       = "1"

# HTTP framework
axum = { version = "0.8", features = ["ws"] }
# The accept loop (server::proxy_protocol) drives hyper directly. Both crates
# are what axum 0.7 already builds on; HTTP/1 only, as axum was configured, so
# nothing new enters the dependency tree.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }

# Storage / serialisation
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1.0"
serde_yaml  = "0.9"
# Metadata databases (IAM, indexes, …): redb, pure Rust, behind storage::kv.
# `rusts3-migrate` (migrate/) converts the RocksDB databases of <= 0.8 and
# must use the same redb version as this crate.
redb        = "3.1"
prost       = "0.14"

# Hashing / auth
md-5    = "0.11"
sha1    = "0.11"
sha2    = "0.11"
hmac    = "0.13"
base64  = "0.23"

# Utilities
rand        = "0.10"
chrono      = "0.4"
urlencoding = "2.1"
httpdate    = "1"
regex       = "1.13"
clap        = { version = "4.6", features = ["derive"] }
multer      = "3"
tempfile    = "3"
tower       = { version = "0.5", features = ["util"] }
# Outbound HTTP (webhook deliveries, replication). rustls with NO built-in
# crypto provider: `server::tls` hands every client a config on graviola
# (Rust + formally verified assembly), so neither ring nor aws-lc — both C —
# is compiled into the server. Bundled webpki roots (`server::tls`): the
# host's CA store is not consulted. Keep `rustls` on the version reqwest uses:
# a mismatched ClientConfig is an "unknown TLS backend" (a test guards this).
reqwest     = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls          = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
graviola        = "0.4"
webpki-roots    = "1"

# Logging
log     = "0.4"
log4rs  = { version = "1.4", features = ["gzip", "background_rotation"] }
bcrypt = "0.19.3"
rpassword = "7.5.4"

[dev-dependencies]
# The AWS SDK, as a real S3 client for tests/sdk_compat.rs: what an SDK user
# sees of versioning, tagging and replication, over a real socket.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

# Only the Unix build makes raw system calls (uid in error messages, openat
# for GETs) — through rustix's safe wrappers rather than `unsafe` libc calls.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[[bin]]
name = "rusts3"
path = "src/bin/rusts3.rs"
